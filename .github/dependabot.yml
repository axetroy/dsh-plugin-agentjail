version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      deepseek-ai:
        patterns:
          - '@deepseek-ai/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
