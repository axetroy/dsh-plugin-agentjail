# Release: publish to npm with trusted publishing (OIDC).
#
# There is no npm token in this workflow. The `id-token: write` permission lets
# GitHub Actions mint a short-lived OIDC token, and the npm CLI exchanges it for
# a publish credential scoped to this workflow. Nothing here can be replayed
# from a leaked secret, because no long-lived secret is involved.
#
# One-time setup on npmjs.com (a maintainer does this once per package):
#   Package -> Settings -> Trusted publishing -> Add trusted publisher ->
#   GitHub Actions, with:
#     Organization or user : axetroy
#     Repository           : dsh-plugin-agentjail
#     Workflow filename    : release.yml
#   Then, for maximum security: Settings -> Publishing access ->
#   "Require two-factor authentication and disallow tokens".
#
# Requirements: npm CLI >= 11.5.1 and Node >= 22.14.0, which `setup-node`
# satisfies below. Provenance is generated automatically for a public package
# published from a public repository, so `--provenance` is not passed.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and pack without publishing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      # Required for OIDC. Granting it at the job keeps the rest read-only.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # A release build must not restore a cache a pull request could write.
          package-manager-cache: false

      - name: Confirm the npm CLI supports trusted publishing
        run: |
          version=$(npm --version)
          echo "npm $version"
          node -e "
            const [major, minor, patch] = process.argv[1].split('.').map(Number)
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)))
            if (!ok) throw new Error('trusted publishing needs npm >= 11.5.1, found ' + process.argv[1])
            console.log('npm CLI supports trusted publishing')
          " "$version"

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run lint && npm run typecheck && npm run test && npm run build

      - name: Check the tag matches package.json
        if: github.event_name == 'push'
        run: |
          node -e "
            const pkg = require('./package.json')
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '')
            if (pkg.version !== tag) {
              throw new Error('tag v' + tag + ' does not match package.json version ' + pkg.version)
            }
            console.log('tag matches version', pkg.version)
          "

      - name: Pack
        run: npm pack --dry-run

      - name: Publish
        if: github.event_name == 'push'
        # No NODE_AUTH_TOKEN: the npm CLI detects the OIDC environment and uses
        # the short-lived credential it mints from it. `--provenance` is omitted
        # because trusted publishing generates provenance automatically.
        run: npm publish --access public

      - name: GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
