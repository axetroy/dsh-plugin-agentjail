name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Upload coverage
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Verify the built package loads
        run: node scripts/check-exports.mjs

  policy:
    name: policy templates (real OPA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install OPA
        run: |
          curl -sSfL -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Check the checked-in bundle parses
        run: opa check policy/

      - name: Run the policy tests against real OPA
        run: npm run build && npx vitest run tests/unit/policy.test.ts

  bundle-manifest:
    name: bundle manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Check the bundle declares a patch that exists
        run: node scripts/check-bundle.mjs

  # The self-contained claim is the one this project makes most loudly, so it is
  # tested against the real upstream binary rather than a stand-in. This job
  # vendors the pinned build, checks its checksum, and drives a real policy
  # evaluation and a real control-plane reload through it.
  vendored:
    name: vendored daemon (real binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Vendor the pinned AgentJail build
        run: npm run vendor

      - name: Verify the vendored build is present
        run: npm run vendor:check

      - name: Run the real-daemon end-to-end tests
        run: npm run build && AGENTJAIL_E2E=1 npx vitest run tests/integration/real-daemon.test.ts

      - name: Check the vendored build ships in the package
        run: |
          # `npm pack` runs `prepare`, whose build output shares stdout with the
          # JSON, so the report is parsed out of the file rather than read whole.
          npm pack --dry-run --json --ignore-scripts > "$RUNNER_TEMP/pack.txt"
          node -e "
            const { readFileSync } = require('node:fs')
            const raw = readFileSync(process.env.RUNNER_TEMP + '/pack.txt', 'utf8')
            const start = raw.indexOf('[')
            const [entry] = JSON.parse(raw.slice(start))
            const vendored = entry.files.filter((f) => f.path.startsWith('vendor/'))
            if (vendored.length === 0) throw new Error('the package does not include the vendored build')
            // Both binaries must ship: the CLI refuses to run `install` without
            // agentjail-hook next to agentjail, and a count-only check would not
            // notice it going missing.
            for (const name of ['agentjail', 'agentjail-hook']) {
              if (!vendored.some((f) => f.path.endsWith('/' + name))) {
                throw new Error('the package is missing the vendored ' + name)
              }
            }
            console.log('package includes', vendored.length, 'vendored files')
          "

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Report only: a failing advisory must not block a security fix from landing.
      - run: npm audit --audit-level=high || true
