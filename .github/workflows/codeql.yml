name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    name: analyze javascript-typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
          # Inline `codeql[...]` suppressions only take effect when the
          # alert-suppression query runs, and it is not part of the default
          # suite. Without this pack a suppression comment is inert and the
          # alert it covers stays open.
          packs: codeql/javascript-queries:AlertSuppression.ql
      - uses: github/codeql-action/analyze@v3
